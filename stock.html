<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora Stock Detail</title><style>
body{margin:0;padding:18px;background:#f3f6fa;color:#172033;font:14px Arial}header,.panel,.card{background:#fff;border:1px solid #dbe3ed;border-radius:10px;padding:16px;margin:12px 0}header{background:#18304f;color:white}h1{margin:0 0 6px}.muted{color:#607089;font-size:12px}.back{display:inline-block;background:white;border:1px solid #c7d4e3;border-radius:8px;padding:9px 12px;text-decoration:none;color:#174f91;font-weight:bold}table{border-collapse:collapse;width:100%}td{padding:9px;border-bottom:1px solid #dbe3ed}.v{font-size:20px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{margin:0}footer{color:#607089;font-size:12px;padding:12px}</style></head><body><a class="back" href="index.html">← Back to Main Page</a><header><h1 id="title">Loading stock…</h1><p id="sub">EMA 9/20 and 20/55 opportunity history</p></header><div class="grid"><div class="card"><div class="muted">Market data date</div><div class="v" id="date">—</div></div><div class="card"><div class="muted">Latest setup status</div><div class="v" id="status">—</div></div></div><section class="panel"><h2>Signal and trade history</h2><table><tbody id="rows"></tbody></table></section><footer>Scanner records are hypothetical opportunities, not actual user holdings. Entry prices are provisional until execution at the next session open.</footer><script>
const s=new URLSearchParams(location.search).get("symbol");const f=x=>x==null?"—":x;async function load(){if(!s)return;try{const r=await fetch("cash_swing/data/stocks/"+encodeURIComponent(s)+".json?ts="+Date.now());if(!r.ok)throw Error("No stock history published for this symbol.");const p=await r.json();document.title=p.symbol+" | Aurora";document.getElementById("title").textContent=p.company+" ("+p.symbol+")";document.getElementById("date").textContent=p.market_date||"—";const a=p.setups||[];document.getElementById("status").textContent=a[0]?.status||"No setup";document.getElementById("rows").innerHTML=a.length?a.map(x=>Object.entries({"Signal date":x.signal_date,"Entry date":x.entry_date,"Entry price ₹":x.entry_price,"Stage 2 signal":x.stage2_signal_date,"Stage 2 entry ₹":x.stage2_entry_price,"Weighted entry ₹":x.weighted_entry,"Initial stop ₹":x.initial_stop,"2R target ₹":x.target_2r,"Latest close ₹":x.latest_close,"Return %":x.unrealised_return_pct,"2R touched":x.target_2r_touched?"Yes":"No","Hard stop date":x.hard_stop_date,"EMA9 exit signal":x.ema9_exit_signal_date,"Exit date":x.exit_date,"Status":x.status}).map(([k,v])=>"<tr><td><b>"+k+"</b></td><td>"+f(v)+"</td></tr>").join("")+"<tr><td colspan=2><hr></td></tr>").join(""):'<tr><td>No qualifying setups in downloaded history.</td></tr>';}catch(e){document.getElementById("status").textContent=e.message;}}load();</script></body></html>
